<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html table</title>
    <link rel="shortcut icon" href="assets/img/h.png" type="image/x-icon">
    <style>
        table{
             border-collapse: collapse;
        }
        th,td{
            border: 1px solid black;
            padding: 5px 10px;
        }
    </style>
</head>
<body> 
    <h1 style="color: aquamarine;">html table</h1>

<table>
    <caption><b>Salary Data</b></caption>

    <thead>
        <tr>
            <th>NO.</th>
            <th>Name</th>
            <th>Company</th>
            <th>Salary</th>
        </tr>

    </thead>
    <tbody>
        <tr>
            <td>1</td>
            <td>gates</td>
            <td>microsoft</td>
            <td>$1000</td>
        </tr>
        <tr>
            <td>2</td>
            <td>steve jobbs</td>
            <td>apple</td>
            <td>$1200</td>
        </tr>
        <tr>
            <td>3</td>
            <td>larry</td>
            <td>google</td>
            <td>$1100</td>
        </tr>
        <tr>
            <td>4</td>
            <td>mark</td>
            <td>facebook</td>
            <td>$1300</td>
        </tr>

    </tbody>
    <tfoot>

        <tr>
            <td  colspan="4" align="center">total employee:4</td>
        </tr>

    </tfoot>


</table> 


</body>
</html>
